services:
  - type: web
    name: vtu-autopilot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run serve
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: VTU_EMAIL
        sync: false
      - key: VTU_PASSWORD
        sync: false
      - key: VTU_COURSE_SLUG
        value: 1-social-networks
      - key: CORS_ORIGIN
        value: "*"
      - key: KV_REST_API_URL
        sync: false
      - key: KV_REST_API_TOKEN
        sync: false
